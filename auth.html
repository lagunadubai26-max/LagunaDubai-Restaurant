<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Laguna Boat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/auth.css?v=3">
  <link rel="stylesheet" href="css/responsive.css">
<script src="js/role-head.js?v=2"></script></head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo-circle"><img src="images/logo.png" alt="Laguna Boat" style="width:56px;height:56px;border-radius:50%"></div>
  <h1>Laguna Boat</h1>
  <p>Restaurant Management</p>
  <div class="auth-tabs" style="display:none"></div>
  <div class="auth-form active" id="adminForm">
    <div class="input-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم">
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">
      <i class="fa-solid fa-lock"></i>
    </div>
    <button class="auth-submit" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
    <p class="auth-error" id="authError"></p>
  </div>
</div>

<!-- Water transition overlay -->
<div class="water-overlay" id="waterOverlay" aria-hidden="true">
  <div class="water-fill">
    <span class="bubble" style="left:12%;width:14px;height:14px;animation-duration:4s;animation-delay:.4s"></span>
    <span class="bubble" style="left:28%;width:9px;height:9px;animation-duration:3.4s;animation-delay:1s"></span>
    <span class="bubble" style="left:47%;width:18px;height:18px;animation-duration:5s;animation-delay:.2s"></span>
    <span class="bubble" style="left:64%;width:11px;height:11px;animation-duration:3.8s;animation-delay:1.4s"></span>
    <span class="bubble" style="left:81%;width:16px;height:16px;animation-duration:4.6s;animation-delay:.8s"></span>
    <span class="bubble" style="left:92%;width:10px;height:10px;animation-duration:3.6s;animation-delay:1.8s"></span>
    <span class="wave wave-a"></span>
    <span class="wave wave-b"></span>
    <div class="water-label">
      <i class="fa-solid fa-ship"></i>
      <span>مرحباً بك على متن لاجونا بوت</span>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-client.js?v=1"></script>
<script src="js/sanitize.js"></script>
<script src="js/password-utils.js"></script>
<script src="js/data.js?v=8"></script>
<script src="js/auth.js?v=3"></script>
</body>
</html>
